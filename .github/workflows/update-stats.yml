
name: Update telemetry stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "assets/templates/**"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

concurrency:
  group: update-telemetry-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # TEMPORARY DEBUG STEP
      - name: Debug repository files
        run: |
          echo "Current branch:"
          git branch --show-current

          echo "Current commit:"
          git rev-parse HEAD

          echo "Template directory:"
          ls -la assets/templates/ || true

          echo "Tracked template files:"
          git ls-tree -r HEAD -- assets/templates/

          echo "Check required template:"
          test -f assets/templates/telemetry-light.template.svg \
            && echo "FOUND" \
            || echo "MISSING"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch stats and regenerate SVGs
        env:
          GITHUB_USERNAME: vanshkalawatia
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-stats.mjs

      - name: Commit and push updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            assets/telemetry.svg \
            assets/dark/telemetry.svg \
            assets/github-stats.svg \
            assets/dark/github-stats.svg \
            assets/contribution-graph.svg \
            assets/dark/contribution-graph.svg \
            assets/stats.json

          if git diff --cached --quiet; then
            echo "No statistics changes."
          else
            git commit -m "chore: refresh telemetry stats"
            git push
          fi
